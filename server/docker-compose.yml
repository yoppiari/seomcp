version: '3.8'

services:
  mcp-seo-server:
    build: .
    container_name: mcp-seo-server
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=4000
      - SESSION_SECRET=${SESSION_SECRET:-change-this-secret-in-production}
      - API_KEY=${API_KEY:-2f3bd395c3a85ec7e2b704b57f07dfac0a6d624c13c536479ca5809db202bcd0}
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
