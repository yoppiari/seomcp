version: '3.8'

services:
  mcp-seo-server:
    build: .
    container_name: mcp-seo-server
    restart: unless-stopped
    expose:
      - "4000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=4000
      - SESSION_SECRET=${SESSION_SECRET:-change-this-secret-in-production}
      - API_KEY=${API_KEY:-2f3bd395c3a85ec7e2b704b57f07dfac0a6d624c13c536479ca5809db202bcd0}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp-seo.rule=Host(`seo.modalhp.com`)"
      - "traefik.http.routers.mcp-seo.entrypoints=websecure"
      - "traefik.http.routers.mcp-seo.tls=true"
      - "traefik.http.routers.mcp-seo.tls.certresolver=letsencrypt"
      - "traefik.http.services.mcp-seo.loadbalancer.server.port=4000"
    networks:
      - toolsumkm_web

networks:
  toolsumkm_web:
    external: true
